# Local development only (CLAUDE.md §12). Credentials below are for this throwaway local stack.
# 1. npm run dev:env      (creates .env with local values + a dev JWT key pair, once)
# 2. docker compose up --build
# Image versions match the integration tests (test/helpers/global-setup.ts).

x-app: &app
  build: .
  env_file: .env
  # Each service sets its own environment (merge keys are shallow): inside the compose network
  # the dependencies are reached by service name, overriding the localhost URLs from .env.
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nile
      POSTGRES_PASSWORD: nile
      POSTGRES_DB: nile
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nile -d nile']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: nile
      RABBITMQ_DEFAULT_PASS: nile
    ports: ['5672:5672', '15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 20

  # S3-compatible storage for media (architecture §14.9): API at http://localhost:9100, console at
  # http://localhost:9101 (host ports off 9000 / 9001, which IDEs and other tools often hold).
  # pgsty/minio is the community build of MinIO (upstream no longer publishes images).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: nile
      MINIO_ROOT_PASSWORD: nile-minio
    ports: ['9100:9000', '9101:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the media bucket once; `public/*` is anonymously readable, standing in for CloudFront.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 nile nile-minio &&
        mc mb --ignore-existing local/nile-media &&
        mc anonymous set download local/nile-media/public
    restart: 'no'

  # Local inbox for development email (EMAIL_PROVIDER=mailpit): web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports: ['8025:8025']

  migrate:
    <<: *app
    environment:
      DATABASE_URL: postgres://nile:nile@postgres:5432/nile
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://nile:nile@rabbitmq:5672
      SERVICE_NAME: nile-migrate
    command: ['node', 'dist/migrate.js', 'latest']
    healthcheck:
      disable: true
    restart: 'no'

  api:
    <<: *app
    environment:
      DATABASE_URL: postgres://nile:nile@postgres:5432/nile
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://nile:nile@rabbitmq:5672
      SERVICE_NAME: nile-api
      # Presigned URLs stay signed for http://localhost:9100 (STORAGE_PUBLIC_ENDPOINT), what browsers reach.
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports: ['3000:3000']

  worker:
    <<: *app
    environment:
      DATABASE_URL: postgres://nile:nile@postgres:5432/nile
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://nile:nile@rabbitmq:5672
      SERVICE_NAME: nile-worker
      MAILPIT_URL: http://mailpit:8025
      STORAGE_ENDPOINT: http://minio:9000
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    # The worker serves no HTTP: its liveness is the process itself.
    healthcheck:
      disable: true

volumes:
  pgdata:
  miniodata:
