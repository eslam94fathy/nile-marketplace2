# CLAUDE.md §12: npm ci → lint → type-check → unit → integration → build → Docker image build → npm audit.
# A red CI blocks merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint && npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # Testcontainers starts Postgres 18, Redis and RabbitMQ on the runner's Docker.
      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nile-marketplace:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dependency audit
        run: npm audit --audit-level=high
