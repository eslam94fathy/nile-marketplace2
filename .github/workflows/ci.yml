# CLAUDE.md §12: npm ci → lint → type-check → unit → integration → build → Docker image build → image and
# configuration scans (Trivy, P8-Q14) → npm audit.
# A red CI blocks merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint && npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # Testcontainers starts Postgres 18, Redis and RabbitMQ on the runner's Docker.
      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nile-marketplace:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # P8-Q14: OS and npm packages in the image, and the Dockerfile / Terraform code. High or critical
      # findings that have a fix fail the build. Pinned Trivy image, no third-party action.
      - name: Image scan (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --quiet --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln
          nile-marketplace:ci-${{ github.sha }}

      - name: Configuration scan (Trivy)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/src" aquasec/trivy:0.74.0
          config --quiet --exit-code 1 --severity HIGH,CRITICAL --skip-dirs node_modules --skip-dirs dist /src

      - name: Dependency audit
        run: npm audit --audit-level=high
